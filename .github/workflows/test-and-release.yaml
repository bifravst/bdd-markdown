name: Test and Release

permissions:
  contents: write
  issues: write
  id-token: write

on:
  push:

env:
  # For chalk: https://github.com/chalk/chalk#supportscolor
  FORCE_COLOR: 3
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  parse:
    name: "Run parse examples"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Parse examples
        run: |
          node --no-warnings parse.ts parser/test-data/feature/Example.feature.md
          node --no-warnings parse.ts parser/test-data/feature/Highlander.feature.md
          node --no-warnings parse.ts examples/mars-rover/MarsRover.feature.md

  mars-rover:
    name: "Run Mars Rover example"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Mars Rover Example
        run: |
          node --no-warnings examples/mars-rover/tests.ts > mars-rover.json
          cat mars-rover.json | node --no-warnings reporter/console-cli.ts
          cat mars-rover.json | node --no-warnings reporter/markdown-cli.ts >> $GITHUB_STEP_SUMMARY

  firmware:
    name: "Run Firmware example"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Firmware Example
        run: |
          node --no-warnings examples/firmware/tests.ts > firmware.json
          cat firmware.json | node --no-warnings reporter/console-cli.ts
          cat firmware.json | node --no-warnings reporter/markdown-cli.ts >> $GITHUB_STEP_SUMMARY

  tests-matrix:
    name: "Test (Node.js ${{ matrix.node-version }})"

    needs: [parse, mars-rover, firmware]

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - ">=24.22.1 <25"
          - ">=26.12.1 <27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile TypeScript
        run: npx tsc

      - name: Check source code with eslint
        run: npx eslint ./

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - name: Run Unit Tests
        run: npm test

      - name: Parse examples
        run: |
          node --no-warnings parse.ts parser/test-data/feature/Example.feature.md
          node --no-warnings parse.ts parser/test-data/feature/Highlander.feature.md
          node --no-warnings parse.ts examples/mars-rover/MarsRover.feature.md

      - name: Run examples
        run: |
          node --no-warnings examples/mars-rover/tests.ts
          node --no-warnings examples/firmware/tests.ts

  tests:
    name: "Test and Release"

    needs: [tests-matrix]

    runs-on: ubuntu-24.04

    # Stable required status check, independent of the Node.js versions in the matrix.
    if: ${{ always() }}

    steps:
      - name: All tests must have succeeded
        env:
          RESULT: ${{ needs.tests-matrix.result }}
        run: test "$RESULT" = "success"

  release:
    name: "Release"

    needs: [tests]

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Semantic release
        run: npx semantic-release
