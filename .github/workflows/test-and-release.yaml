name: Test and Release

on:
  push:

env:
  # For chalk: https://github.com/chalk/chalk#supportscolor
  FORCE_COLOR: 3
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  parse:
    name: "Run parse examples"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.19.0 <25"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Parse examples
        run: |
          node --no-warnings --experimental-transform-types parse.ts parser/test-data/feature/Example.feature.md
          node --no-warnings --experimental-transform-types parse.ts parser/test-data/feature/Highlander.feature.md
          node --no-warnings --experimental-transform-types parse.ts examples/mars-rover/MarsRover.feature.md

  mars-rover:
    name: "Run Mars Rover example"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.19.0 <25"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Mars Rover Example
        run: |
          node --no-warnings --experimental-transform-types examples/mars-rover/tests.ts > mars-rover.json
          cat mars-rover.json | node --no-warnings --experimental-transform-types reporter/console-cli.ts
          cat mars-rover.json | node --no-warnings --experimental-transform-types reporter/markdown-cli.ts >> $GITHUB_STEP_SUMMARY

  firmware:
    name: "Run Firmware example"

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.19.0 <25"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Firmware Example
        run: |
          node --no-warnings --experimental-transform-types examples/firmware/tests.ts > firmware.json
          cat firmware.json | node --no-warnings --experimental-transform-types reporter/console-cli.ts
          cat firmware.json | node --no-warnings --experimental-transform-types reporter/markdown-cli.ts >> $GITHUB_STEP_SUMMARY

  tests:
    name: "Test and Release"

    needs: [parse, mars-rover, firmware]

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.19.0 <25"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile TypeScript
        run: npx tsc

      - name: Check source code with eslint
        run: npx eslint ./

      - name: Check if source code is properly formatted
        run: npx prettier -c ./

      - name: Run Unit Tests
        run: npm test

      - name: Parse examples
        run: |
          node --no-warnings --experimental-transform-types parse.ts parser/test-data/feature/Example.feature.md
          node --no-warnings --experimental-transform-types parse.ts parser/test-data/feature/Highlander.feature.md
          node --no-warnings --experimental-transform-types parse.ts examples/mars-rover/MarsRover.feature.md

      - name: Run examples
        run: |
          node --no-warnings --experimental-transform-types examples/mars-rover/tests.ts
          node --no-warnings --experimental-transform-types examples/firmware/tests.ts

      - name: Semantic release
        run: npx semantic-release
